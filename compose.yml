x-env: &env
  REDIS_URL: redis://redis
  GLOWFIC_DATABASE_HOST: postgres
  GLOWFIC_DATABASE_USER: postgres
  GLOWFIC_DATABASE_PASS: postgres
  AWS_ACCESS_KEY_ID: glowfic_s3
  AWS_SECRET_ACCESS_KEY: glowfic_s3
  S3_BUCKET_NAME: glowfic-dev
  LOCAL_S3_ENDPOINT: http://s3:9000/
  LOCAL_S3_ENDPOINT_EXTERNAL: http://localhost:9000/
  ACCOUNT_SECRET: secret
x-svc: &svc
  build: .
  image: glowfic
  links:
    - redis
    - postgres
    - s3
  volumes:
    - .:/code:z
    - bundler-volume:/usr/local/bundle
    - webdrivers:/root/.webdrivers # caches webdrivers for selenium feature specs

services:
  web:
    <<: *svc
    ports:
      - 3000:3000
    command: bin/with-bundle bin/rails s
    environment:
      <<: *env
      BIND_HOST: 0.0.0.0
      # allow accessing the server from backstop
      RAILS_DEVELOPMENT_HOSTS: web:3000
  worker:
    <<: *svc
    command: bin/with-bundle rake resque:work
    environment:
      <<: *env
      TERM_CHILD: 1
      RESQUE_TERM_TIMEOUT: 7
      QUEUES: mailer,notifier,high,*
  redis:
    image: redis:7.2-alpine
    ports:
      - 6379:6379
  postgres:
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGUSER=postgres
      - PGPASSWORD=postgres
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
  # S3-compatible object store for icon uploads (replaces MinIO).
  # /data must be a named volume: the image runs as uid 10001 and can't
  # write a host directory owned by someone else.
  s3:
    image: rustfs/rustfs:1.0.0-rc.6
    environment:
      - RUSTFS_ACCESS_KEY=glowfic_s3
      - RUSTFS_SECRET_KEY=glowfic_s3
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
    ports:
      - 9000:9000
      - 9001:9001 # web console, for poking at uploaded objects
    volumes:
      - rustfs-data:/data

volumes:
  bundler-volume:
  postgres-data:
  webdrivers:
  rustfs-data:
